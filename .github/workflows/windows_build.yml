name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'  # FORCE 64-BIT ARCHITECTURE

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy customtkinter sounddevice just_playback librosa

    - name: Build with PyInstaller
      run: |
        cd src
        pyinstaller SmartAlarm.spec --clean -y

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v4
      with:
        name: SmartAlarm-Windows-Build
        path: src/dist/